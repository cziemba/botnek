name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mainline]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run prettier

      - name: Build
        run: npm run build

      - name: Test (unit only)
        run: npx vitest run --exclude '**/*.integration.test.ts'
