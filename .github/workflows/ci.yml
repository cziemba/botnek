name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mainline]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stub config.json
        run: echo '{"token":"","dataRoot":"./data"}' > src/config.json

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run prettier

      - name: Build
        run: npm run build

      - name: Test (unit only)
        run: npx vitest run --exclude '**/*.integration.test.ts'
